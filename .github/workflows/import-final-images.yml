name: Import final image pack

on:
  push:
    branches: [feat/final-image-pack]

permissions:
  contents: write

jobs:
  import:
    if: "!contains(github.event.head_commit.message, '[asset-import]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/final-image-pack
          fetch-depth: 0

      - name: Install WebP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp

      - name: Download approved final renders
        run: |
          set -euxo pipefail
          mkdir -p /tmp/dv-assets public/images
          curl -fL --retry 3 "https://at.adobe.com/zLnMeNw0HB9IlIoP" -o /tmp/dv-assets/hero.png
          curl -fL --retry 3 "https://at.adobe.com/C3peXCV7vLzV6ycH" -o /tmp/dv-assets/project.png
          curl -fL --retry 3 "https://at.adobe.com/Hw5U6rooV2Dux0ti" -o /tmp/dv-assets/gallery-front.png
          curl -fL --retry 3 "https://at.adobe.com/oXoawPur60V5osYi" -o /tmp/dv-assets/gallery-entry.png
          curl -fL --retry 3 "https://at.adobe.com/1PIHGbO9E0F2rIWb" -o /tmp/dv-assets/gallery-retail.png

      - name: Convert to high-quality WebP
        run: |
          set -euxo pipefail
          cwebp -quiet -q 86 -m 6 /tmp/dv-assets/hero.png -o public/images/hero.webp
          cwebp -quiet -q 86 -m 6 /tmp/dv-assets/project.png -o public/images/project.webp
          cwebp -quiet -q 86 -m 6 /tmp/dv-assets/gallery-front.png -o public/images/gallery-front.webp
          cwebp -quiet -q 86 -m 6 /tmp/dv-assets/gallery-entry.png -o public/images/gallery-entry.webp
          cwebp -quiet -q 86 -m 6 /tmp/dv-assets/gallery-retail.png -o public/images/gallery-retail.webp
          ls -lh public/images/*.webp

      - name: Commit final assets
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/import-final-images.yml
          git add public/images/hero.webp public/images/project.webp public/images/gallery-front.webp public/images/gallery-entry.webp public/images/gallery-retail.webp
          git commit -m "assets: replace landing renders with final WebP pack [asset-import]"
          git push origin HEAD:feat/final-image-pack
