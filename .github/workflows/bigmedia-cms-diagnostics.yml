name: Big Media CMS - Cloudflare capability check

on:
  push:
    branches:
      - feat/bigmedia-cms-diagnostics
    paths:
      - .github/workflows/bigmedia-cms-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets['api_cldflr'] }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets['CLFLR_AXLULISESFS'] }}
    steps:
      - name: Check Cloudflare API resources without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Cloudflare token not available"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Cloudflare account id not available"; exit 1; }
          for resource in "pages/projects/bigmedia-webpage" "d1/database" "r2/buckets" "access/apps" "access/organizations"; do
            tempfile="$(mktemp)"
            http="$(curl -sS --max-time 20 -o "$tempfile" -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/$resource")"
            RESOURCE="$resource" CODE="$http" FILE="$tempfile" node - <<'NODE'
          const fs=require('node:fs');
          const resource=process.env.RESOURCE;
          const code=process.env.CODE;
          let payload={};try{payload=JSON.parse(fs.readFileSync(process.env.FILE,'utf8'))}catch{}
          const result=payload.result;
          let match='unknown';
          if(resource==='pages/projects/bigmedia-webpage')match=result?.name||'not_found';
          else if(resource==='d1/database')match=(Array.isArray(result)?result:result?.databases||[]).some(x=>x.name==='bigmedia-cms')?'exists':'missing';
          else if(resource==='r2/buckets')match=(Array.isArray(result?.buckets)?result.buckets:[]).some(x=>x.name==='bigmedia-cms-media')?'exists':'missing';
          else if(resource==='access/apps')match=Array.isArray(result)?'list readable':'not readable';
          else if(resource==='access/organizations')match=result?.auth_domain?'organization found':'not readable';
          console.log(resource,'http='+code,'success='+String(payload.success===true),'state='+match,'errors='+(payload.errors||[]).map(x=>x.code).join(','));
          NODE
            rm -f "$tempfile"
          done

          for resource in "pages/projects/bigmedia-webpage" "access/apps"; do
            tempfile="$(mktemp)"
            curl --fail-with-body -sS --max-time 20 -o "$tempfile" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/$resource"
            RESOURCE="$resource" FILE="$tempfile" node - <<'NODE'
          const fs=require('node:fs');const a=JSON.parse(fs.readFileSync(process.env.FILE,'utf8'));const p=a.result;
          if(process.env.RESOURCE.startsWith('pages/'))console.log('Pages source:',p?.source?.type,'branch:',p?.production_branch,'D1:',Object.keys(p?.deployment_configs?.production?.d1_databases||{}),'R2:',Object.keys(p?.deployment_configs?.production?.r2_buckets||{}),'env keys:',Object.keys(p?.deployment_configs?.production?.env_vars||{}));
          else {const matches=(p||[]).filter(x=>String(x.domain||'').includes('bigmedia')||String(x.name||'').toLowerCase().includes('big media'));console.log('Matching Access apps:',matches.map(x=>({name:x.name,domain:x.domain,type:x.type,hasAUD:!!x.aud,policyCount:x.policies?.length||0})));}
          NODE
            rm -f "$tempfile"
          done

          node - <<'NODE'
          (async()=>{
            const token=process.env.CLOUDFLARE_API_TOKEN,account=process.env.CLOUDFLARE_ACCOUNT_ID;
            const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+'/members?per_page=100',{headers:{Authorization:'Bearer '+token}});
            let j={};try{j=await r.json()}catch{}
            const members=Array.isArray(j.result)?j.result:[];
            console.log('Account member access:',r.status,'members:',members.length,'with-email:',members.filter(m=>m.user?.email).length,'owner-role:',members.filter(m=>JSON.stringify(m.roles||[]).toLowerCase().includes('super administrator')).length,'errors:',(j.errors||[]).map(e=>e.code).join(','));
          })().catch(e=>{console.log('Member lookup unavailable');});
          NODE
