name: Big Media CMS - Provision D1 binding

on:
  push:
    branches:
      - feat/bigmedia-cms-diagnostics
    paths:
      - .github/workflows/bigmedia-cms-provision.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets['api_cldflr'] }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets['CLFLR_AXLULISESFS'] }}
    steps:
      - name: Create Big Media D1 and bind to existing Pages project (no changes to other sites)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node - <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
          const prefix='https://api.cloudflare.com/client/v4/accounts/'+account;
          async function cf(method,path,body){
            const response=await fetch(prefix+path,{method,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});
            let p={};try{p=await response.json()}catch{}
            if(!response.ok||p.success!==true){console.error('Cloudflare request failed:',method,path,'HTTP',response.status,'codes',(p.errors||[]).map(e=>e.code));throw Error('Cloudflare operation failed');}
            return p.result;
          }
          (async()=>{
            const list=await cf('GET','/d1/database?per_page=100');
            const databases=Array.isArray(list)?list:(list?.databases||[]);
            let db=databases.find(x=>x.name==='bigmedia-cms');
            if(!db){db=await cf('POST','/d1/database',{name:'bigmedia-cms'});console.log('Big Media D1 created');}
            else console.log('Big Media D1 already exists');
            const id=db.uuid||db.id;
            if(!id)throw Error('D1 database ID missing');
            const tables=[
              'CREATE TABLE IF NOT EXISTS cms_content (id TEXT PRIMARY KEY,kind TEXT NOT NULL,draft_json TEXT,published_json TEXT,editor_email TEXT,updated_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP,published_at TEXT)',
              'CREATE TABLE IF NOT EXISTS cms_history (revision_id TEXT PRIMARY KEY,entry_id TEXT NOT NULL,actor_email TEXT NOT NULL,action TEXT NOT NULL,payload_json TEXT NOT NULL,created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP)',
              'CREATE TABLE IF NOT EXISTS cms_assets (id TEXT PRIMARY KEY,object_key TEXT NOT NULL,content_type TEXT NOT NULL,size INTEGER NOT NULL,published INTEGER NOT NULL DEFAULT 0,created_by TEXT NOT NULL,created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP)',
              'CREATE TABLE IF NOT EXISTS cms_editorial (kind TEXT NOT NULL,id TEXT NOT NULL,draft_json TEXT,published_json TEXT,editor_email TEXT,updated_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP,published_at TEXT,PRIMARY KEY(kind,id))'
            ];
            for(const sql of tables)await cf('POST','/d1/database/'+id+'/query',{sql});
            console.log('Big Media D1 schema checked');
            const current=await cf('GET','/pages/projects/bigmedia-webpage');
            if(current.name!=='bigmedia-webpage'||current.production_branch!=='main')throw Error('Unexpected Pages project configuration');
            const previous=current.deployment_configs?.production?.d1_databases||{};
            if(previous.CMS_DB?.id!==id){
              await cf('PATCH','/pages/projects/bigmedia-webpage',{deployment_configs:{production:{d1_databases:{...previous,CMS_DB:{id}}}}});
              console.log('Bound CMS_DB in Pages production configuration');
            }else console.log('CMS_DB binding already present');
            const verified=await cf('GET','/pages/projects/bigmedia-webpage');
            if(verified.deployment_configs?.production?.d1_databases?.CMS_DB?.id!==id)throw Error('Pages D1 binding did not persist');
            console.log('Verified: Big Media D1 binding persists. R2 and Access are not modified.');
          })().catch(e=>{console.error(e.message);process.exitCode=1;});
          NODE
