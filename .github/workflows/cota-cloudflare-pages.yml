name: Deploy COTA to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cota-cloudflare-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cota-cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch COTA public repository (leave Distrito untouched)
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch main https://github.com/im-ulises/cota-landing.git cota-site
          test -s cota-site/index.html
          test -s cota-site/assets/inundacion-juarez-crop.jpg
          grep -q COTA cota-site/index.html

      - name: Install pinned Cloudflare CLI
        run: npm install --global wrangler@4.45.0

      - name: Ensure COTA Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets['api_cldflr'] }}
          CLOUDFLARE_ACCOUNT_ID: 756a510f19b5f736d154fac36ff12749
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          http_code=$(curl --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
            --output /tmp/cota-pages-projects.json --write-out "%{http_code}")
          node -e '
            const fs=require("node:fs");
            const response=JSON.parse(fs.readFileSync("/tmp/cota-pages-projects.json","utf8"));
            const code=process.argv[1];
            console.log("Cloudflare Pages HTTP status:",code);
            console.log("Cloudflare error codes:",(response.errors||[]).map(e=>Number(e.code)));
            if(code!=="200" || response.success!==true) process.exit(1);
          ' "$http_code"
          if node -e '
            const fs=require("node:fs");
            const data=JSON.parse(fs.readFileSync("/tmp/cota-pages-projects.json","utf8"));
            if (!data.success || !Array.isArray(data.result)) throw new Error("Cloudflare Pages listing failed");
            process.exit(data.result.some(project=>project.name==="cota-landing") ? 0 : 1);
          '; then
            echo "Cloudflare Pages project already exists"
          else
            wrangler pages project create cota-landing --production-branch main
          fi

      - name: Deploy COTA (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets['api_cldflr'] }}
          CLOUDFLARE_ACCOUNT_ID: 756a510f19b5f736d154fac36ff12749
        run: |
          set -euo pipefail
          cd cota-site
          wrangler pages deploy . --project-name cota-landing --branch main --commit-hash "$(git rev-parse HEAD)" --commit-message "Deploy COTA V3"

      - name: Verify public page and image
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl -fLsS --max-time 15 https://cota-landing.pages.dev/ -o /tmp/cota-live.html && grep -q "COTA" /tmp/cota-live.html && curl -fLsS --max-time 15 https://cota-landing.pages.dev/assets/inundacion-juarez-crop.jpg -o /dev/null; then
              echo "Verified: https://cota-landing.pages.dev/"
              exit 0
            fi
            sleep 10
          done
          echo "The deployment finished, but the live site did not pass verification"
          exit 1
