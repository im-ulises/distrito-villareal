name: Big Media CMS - Verify production

on:
  push:
    branches:
      - feat/bigmedia-cms-diagnostics
    paths:
      - .github/workflows/bigmedia-cms-verify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets['api_cldflr'] }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets['CLFLR_AXLULISESFS'] }}
    steps:
      - name: Check Big Media deployment state and public CMS endpoints
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
          (async()=>{
            const url='https://api.cloudflare.com/client/v4/accounts/'+account+'/pages/projects/bigmedia-webpage/deployments?per_page=5';
            const response=await fetch(url,{headers:{Authorization:'Bearer '+token}});
            const result=await response.json();
            if(!response.ok||!result.success)throw Error('Unable to inspect Pages deployments HTTP '+response.status);
            const deployments=Array.isArray(result.result)?result.result:result.result?.deployments||[];
            for(const d of deployments.slice(0,5)){
              console.log('Pages deployment:',JSON.stringify({id:d.id,environment:d.environment,branch:d.deployment_trigger?.metadata?.branch,commit:(d.deployment_trigger?.metadata?.commit_hash||'').slice(0,12),created_on:d.created_on,latest_stage:d.latest_stage?.name,status:d.latest_stage?.status,url:d.url}));
            }
            const root='https://bigmedia-webpage.pages.dev';
            for(const path of ['/api/cms/status','/api/editorial/published','/api/editorial/me','/admin/']){
              try{
                const r=await fetch(root+path,{redirect:'manual',signal:AbortSignal.timeout(15000)});
                const text=await r.text();let data={};try{data=JSON.parse(text)}catch{}
                console.log('LIVE',path,'HTTP',r.status,'content-type',r.headers.get('content-type')||'','configured',data.configured??'n/a','ok',data.ok??'n/a','entries',Array.isArray(data.entries)?data.entries.length:'n/a','redirect-login',r.status>=300&&r.status<400);
              }catch(e){console.log('LIVE',path,'fetch failed:',e.name);}
            }
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
