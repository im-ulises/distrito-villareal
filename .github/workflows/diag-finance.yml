name: Diagnose finance Cloudflare

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diag-finance.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_API_TOKEN: ${{ secrets.api_cldflr }}
      CF_ACCOUNT_ID: ${{ secrets.CLFLR_AXLULISESFS }}
    steps:
      - name: Probe deployed Worker
        run: |
          set -euo pipefail
          echo "== Worker health =="
          code=$(curl -sS -o /tmp/health.txt -w "%{http_code}" "https://ulises-finance-tracker.axlulisesfs.workers.dev/api/health" || true)
          echo "HTTP $code"
          cat /tmp/health.txt || true
          echo

      - name: Inspect Worker bindings
        run: |
          set -euo pipefail
          echo "== Worker settings =="
          curl -sS "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/ulises-finance-tracker/settings"             -H "Authorization: Bearer $CF_API_TOKEN"             | jq '{success, errors, bindings: ((.result.bindings // []) | map({name,type,namespace_id,database_id,id}))}'

      - name: Inspect D1 databases
        run: |
          set -euo pipefail
          echo "== D1 databases =="
          resp=$(curl -sS "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/d1/database?per_page=100"             -H "Authorization: Bearer $CF_API_TOKEN")
          echo "$resp" | jq '{success, errors, result: [.result[]? | {name,uuid,created_at,version}]}'

          uuid=$(echo "$resp" | jq -r '.result[]? | select((.name // "") | test("ulises-finance"; "i")) | .uuid' | head -1)
          if [ -n "$uuid" ]; then
            echo "== Matching D1 schema/counts =="
            curl -sS "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/d1/database/$uuid/query"               -H "Authorization: Bearer $CF_API_TOKEN"               -H "Content-Type: application/json"               --data '{"sql":"SELECT name,type FROM sqlite_master WHERE type IN ('"'"'table'"'"','"'"'index'"'"') ORDER BY type,name; SELECT COUNT(*) AS transaction_count FROM transactions; SELECT key,value FROM meta WHERE key='"'"'seed_version'"'"';"}'               | jq '{success, errors, result}'
          else
            echo "No D1 database name matching ulises-finance was visible to this token."
          fi
